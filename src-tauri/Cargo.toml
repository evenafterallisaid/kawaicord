[package]
name = "kawaicord"
version = "2.0.0-beta.1"
description = "A lightweight native Discord web client"
authors = ["Kawaicord contributors"]
edition = "2021"
rust-version = "1.94"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
regex = "1"
base64 = "0.22"
sha2 = "0.10"
url = "2"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio-tungstenite = "0.28"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
