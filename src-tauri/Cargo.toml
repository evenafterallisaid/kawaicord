[package]
name = "kawaicord"
version = "2.0.0"
description = "A lightweight native Discord web client"
authors = ["Kawaicord contributors"]
edition = "2021"
rust-version = "1.94"
license = "MIT"
default-run = "kawaicord"

[features]
default = ["native"]
native = ["dep:tauri", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-autostart", "dep:tauri-plugin-opener", "dep:tauri-plugin-notification", "dep:tauri-plugin-updater", "dep:objc2", "dep:objc2-foundation", "dep:block2", "dep:webkit2gtk", "dep:gtk", "dep:webview2-com", "dep:windows"]
core-helper = ["dep:minisign-verify", "tokio/io-std", "tokio/fs"]

[[bin]]
name = "kawaicord"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "kawaicord-core"
path = "src/core.rs"
required-features = ["core-helper"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
regex = "1"
base64 = "0.22"
sha2 = "0.10"
semver = "1"
url = "2"
log = "0.4"
env_logger = "0.11"
minisign-verify = { version = "0.3", optional = true }
futures-util = "0.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio-tungstenite = "0.28"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", optional = true }
objc2-foundation = { version = "0.3.2", optional = true }
block2 = { version = "0.6.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", optional = true }
gtk = { version = "0.18", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = { version = "0.39.1", optional = true }
windows = { version = "0.62.2", optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
panic = "abort"
