name: native builds
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      tag:
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
permissions:
  contents: read
jobs:
  package:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            args: --target universal-apple-darwin --bundles app,dmg
            binary: src-tauri/target/universal-apple-darwin/release/bundle/macos/Kawaicord.app/Contents/MacOS/kawaicord
          - os: windows-latest
            platform: windows
            args: --bundles nsis
            binary: src-tauri/target/release/kawaicord.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - name: build packages
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          args: ${{ matrix.args }} ${{ !inputs.release && '--config {"bundle":{"createUpdaterArtifacts":false}}' || '' }}
          tagName: ${{ inputs.release && inputs.tag || '' }}
          releaseName: kawaicord __VERSION__, coffee acquired
          releaseBody: the native client, with coffee and fewer browser tantrums. full notes are in RELEASE_NOTES.md. install packages are below.
          releaseDraft: true
          prerelease: ${{ contains(inputs.tag, '-') }}
          uploadWorkflowArtifacts: true
          updaterJsonPreferNsis: true
      - name: check macos signature and architectures
        if: matrix.platform == 'macos'
        run: |
          codesign --verify --deep --strict src-tauri/target/universal-apple-darwin/release/bundle/macos/Kawaicord.app
          codesign -d --entitlements - --xml src-tauri/target/universal-apple-darwin/release/bundle/macos/Kawaicord.app > "$RUNNER_TEMP/kawaicord-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$RUNNER_TEMP/kawaicord-entitlements.plist")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.camera' "$RUNNER_TEMP/kawaicord-entitlements.plist")" = true
          lipo -archs "${{ matrix.binary }}"
          hdiutil verify src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: live discord startup with all three mods
        run: node scripts/smoke-native.mjs "${{ matrix.binary }}"
      - name: packaged discord voice engine and encrypted media capabilities
        run: node scripts/smoke-native.mjs "${{ matrix.binary }}" --media-preflight
      - name: settings, cloud configuration, and instance isolation
        run: node scripts/smoke-native.mjs "${{ matrix.binary }}" --integration
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            linux-host/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: chromium packaging and audio test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 libdrm2 libgbm1 libasound2 libfuse2 xdg-utils xvfb pulseaudio
      - run: npm ci
      - run: npm run build
      - run: node --test tests/*.test.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features core-helper --bin kawaicord-core
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features --features core-helper --bin kawaicord-core -- -D warnings
      - run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --no-default-features --features core-helper --bin kawaicord-core
      - name: ensure the helper does not carry a second browser engine
        run: |
          ldd src-tauri/target/release/kawaicord-core | tee "$RUNNER_TEMP/core-libraries.txt"
          ! grep -Ei 'webkit|javascriptcore|gtk' "$RUNNER_TEMP/core-libraries.txt"
      - run: npm ci --prefix linux-host
      - run: npm run build --prefix linux-host
      - run: npm audit --omit=dev
      - run: npm audit --prefix linux-host
      - run: node --test tests/linux-host.test.mjs
      - run: npm run package --prefix linux-host
      - name: live discord startup with all three mods
        run: xvfb-run -a node scripts/smoke-native.mjs linux-host/release/linux-unpacked/kawaicord
      - name: packaged voice engine and real audio loopback
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=kawaicord_test
          xvfb-run -a node scripts/smoke-native.mjs linux-host/release/linux-unpacked/kawaicord --media
      - name: settings, cloud, window controls, and instance isolation
        env:
          KAWAICORD_FRAME_CAPTURE: ${{ runner.temp }}/linux-titlebar.png
        run: xvfb-run -a node scripts/smoke-native.mjs linux-host/release/linux-unpacked/kawaicord --integration
      - name: background connection durability
        run: xvfb-run -a node scripts/smoke-native.mjs linux-host/release/linux-unpacked/kawaicord --background
      - name: sign the linux updater
        if: inputs.release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          version=$(node -p "require('./package.json').version")
          npx tauri signer sign --app-version "$version" linux-host/release/*.AppImage
      - uses: actions/upload-artifact@v6
        with:
          name: kawaicord-linux
          path: |
            linux-host/release/*.AppImage
            linux-host/release/*.deb
            linux-host/release/*.sig
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-titlebar
          path: ${{ runner.temp }}/linux-titlebar.png
