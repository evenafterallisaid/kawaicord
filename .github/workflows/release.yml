name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ("v$packageVersion" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package version $packageVersion"
          }

      - name: Test and build installer
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish installer and matching update metadata
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = node -p "require('./package.json').version"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --generate-notes --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag "build/Kawaicord-Setup-$version-x64.exe" "build/Kawaicord-Setup-$version-x64.exe.blockmap" "build/latest.yml" --clobber --repo "${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
