name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    uses: ./.github/workflows/native.yml
    with:
      release: true
      tag: ${{ github.ref_name }}
    secrets: inherit
  publish:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          name: kawaicord-linux
          path: linux-artifacts
      - name: add linux packages and merge the signed updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-linux.mjs linux-artifacts
      - name: publish after every platform passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME"
          if [[ "$version" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest --notes-file RELEASE_NOTES.md --repo "$GITHUB_REPOSITORY"
          fi
